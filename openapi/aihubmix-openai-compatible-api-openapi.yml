  /v1/videos/{video_id}/content:
    get:
      tags:
      - OpenAI Compatible
      summary: Download Video Content
      operationId: RetrieveVideoContent
      parameters:
      - name: video_id
        in: path
        description: The identifier of the video whose media to download.
        required: true
        schema:
          example: video_123
          type: string
        x-source:
          from: avs://openai/official
          authority: official
      - name: variant
        in: query
        description: Which downloadable asset to return. Defaults to the MP4 video.
        required: false
        schema:
          $ref: '#/components/schemas/VideoContentVariant'
        x-source:
          from: avs://openai/official
          authority: official
      responses:
        '200':
          description: The video bytes or preview asset that matches the requested variant.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/json:
