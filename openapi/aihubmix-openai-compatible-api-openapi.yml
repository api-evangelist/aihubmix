      type: object
      properties:
        model:
          description: 'ID of the model to use. You can use the [List models](https://developers.openai.com/api/docs/api-reference/models/list) API to see all of your available models, or see our [Model overview](https://developers.openai.com/api/docs/models) for descriptions of them.

