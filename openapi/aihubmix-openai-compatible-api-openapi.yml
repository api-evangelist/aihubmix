openapi: 3.2.0
info:
  title: Aihubmix OpenAI Compatible API
  version: 2.1.1
  contact:
    name: AIHubMix Team
  x-upstream:
    vendorSpecs:
      packageVersion: 0.1.1
      installedFrom: npm
    sources:
      openai/official:
        version: '2026-05-31'
        hash: sha256:a203971a0bc0cd3b903b9488e3ac40eaa161a274dfaf172c1da73eee029147a8
      anthropic/official:
        version: '2026-05-31'
        hash: sha256:f9d488f9290d78a081bed62fa0c040476b5d009f3db92c06c8e279e69df73fc9
    layers:
    - role: L0-base
      source: avs://openai/official
      protocol: openai
      authority: official
    - role: L0-base
      source: avs://anthropic/official
      protocol: anthropic
      authority: official
    - role: gateway-other
      source: gateway/anthropic-mappings.yml
      protocol: all
      authority: gateway
    - role: horizontal-auth
      source: gateway/auth.yml
      protocol: all
      authority: gateway
    - role: horizontal-errors
      source: gateway/errors.yml
      protocol: all
      authority: gateway
    - role: L3-gateway
      source: gateway/openai-gateway.yml
      protocol: openai
      authority: gateway
    - role: gateway-other
      source: gateway/openai-image-mappings.yml
      protocol: all
      authority: gateway
    - role: gateway-other
      source: gateway/openai-mappings.yml
      protocol: all
      authority: gateway
    - role: L2-passthrough
      source: gateway/openai-passthrough.yml
      protocol: openai
      authority: gateway
  description: 'Operations tagged OpenAI Compatible across 2 of this provider''s published API definitions: aihubmix-docs-openapi.json, aihubmix-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://aihubmix.com
  description: Production
- url: https://api.inferera.com
  description: Backup (use when the primary domain is unreachable)
security:
- gatewayBearer: []
tags:
- name: OpenAI Compatible
  description: OpenAI-compatible endpoints (chat, completions, embeddings, images, audio, videos, moderations).
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags:
      - OpenAI Compatible
      summary: Create a Chat Completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionStreamResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        5XX:
          description: Server / upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
      x-source:
        from: avs://openai/official
        authority: official
      description: '**Starting a new project?** We recommend trying Responses

        to take advantage of the latest OpenAI platform features. Compare

        Chat Completions with Responses.


        ---


        Creates a model response for the given chat conversation. Learn more in the

        text generation, vision,

        and audio guides.


        Parameter support can differ depending on the model used to generate the

        response, particularly for newer reasoning models. Parameters that are only

        supported for reasoning models are noted below. For the current state of

        unsupported parameters in reasoning models,

        refer to the reasoning guide.


        Returns a chat completion object, or a streamed sequence of chat completion

        chunk objects if the request is streamed.'
    servers:
    - url: https://aihubmix.com
      description: Production
    - url: https://api.inferera.com
      description: Backup (use when the primary domain is unreachable)
  /v1/responses:
    post:
      operationId: createResponse
      tags:
      - OpenAI Compatible
      summary: Create a Model Response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponse'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ResponseStreamEvent'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        5XX:
          description: Server / upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
      x-source:
        from: avs://openai/official
        authority: official
      description: 'Creates a model response. Provide text or

        image inputs to generate text

        or JSON outputs. Have the model call

        your own custom code or use built-in

        tools like web search

        or file search to use your own data

        as input for the model''s response.'
    servers:
    - url: https://aihubmix.com
      description: Production
    - url: https://api.inferera.com
      description: Backup (use when the primary domain is unreachable)
