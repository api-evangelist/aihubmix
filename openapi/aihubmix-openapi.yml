    AnthropicCreateMessageParams:
      additionalProperties: false
      example:
        max_tokens: 1024
        messages:
        - content: Hello, world
          role: user
        model: claude-opus-4-6
      properties:
        model:
          $ref: '#/components/schemas/AnthropicModel'
        messages:
          description: "Input messages.\n\nOur models are trained to operate on alternating `user` and `assistant` conversational turns. When\
            \ creating a new `Message`, you specify the prior conversational turns with the `messages` parameter, and the model then generates\
            \ the next `Message` in the conversation. Consecutive `user` or `assistant` turns in your request will be combined into a single turn.\n\
            \nEach input message must be an object with a `role` and `content`. You can specify a single `user`-role message, or you can include\
            \ multiple `user` and `assistant` messages.\n\nIf the final message uses the `assistant` role, the response content will continue\
            \ immediately from the content in that message. This can be used to constrain part of the model's response.\n\nExample with a single\
            \ `user` message:\n\n```json\n[{\"role\": \"user\", \"content\": \"Hello, Claude\"}]\n```\n\nExample with multiple conversational\
            \ turns:\n\n```json\n[\n  {\"role\": \"user\", \"content\": \"Hello there.\"},\n  {\"role\": \"assistant\", \"content\": \"Hi, I'm\
            \ Claude. How can I help you?\"},\n  {\"role\": \"user\", \"content\": \"Can you explain LLMs in plain English?\"},\n]\n```\n\nExample\
            \ with a partially-filled response from Claude:\n\n```json\n[\n  {\"role\": \"user\", \"content\": \"What's the Greek name for Sun?\
            \ (A) Sol (B) Helios (C) Sun\"},\n  {\"role\": \"assistant\", \"content\": \"The best answer is (\"},\n]\n```\n\nEach input message\
            \ `content` may be either a single `string` or an array of content blocks, where each block has a specific `type`. Using a `string`\
            \ for `content` is shorthand for an array of one content block of type `\"text\"`. The following input messages are equivalent:\n\n\
            ```json\n{\"role\": \"user\", \"content\": \"Hello, Claude\"}\n```\n\n```json\n{\"role\": \"user\", \"content\": [{\"type\": \"text\"\
            , \"text\": \"Hello, Claude\"}]}\n```\n\nSee [input examples](https://docs.claude.com/en/api/messages-examples).\n\nNote that if you\
            \ want to include a [system prompt](https://docs.claude.com/en/docs/system-prompts), you can use the top-level `system` parameter\
            \ — there is no `\"system\"` role for input messages in the Messages API.\n\nThere is a limit of 100,000 messages in a single request."
          items:
            $ref: '#/components/schemas/AnthropicInputMessage'
          title: Messages
          type: array
          x-providers:
            openai:
              transform: anthropic_messages_to_openai_messages
            azure:
              transform: anthropic_messages_to_openai_messages
            gemini:
              to:
              - contents
              transform: anthropic_messages_to_gemini_contents
            vertex:
              to:
              - contents
              transform: anthropic_messages_to_gemini_contents
        cache_control:
          anyOf:
          - discriminator:
              mapping:
                ephemeral: '#/components/schemas/CacheControlEphemeral'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/AnthropicCacheControlEphemeral'
          - type: 'null'
          description: Top-level cache control automatically applies a cache_control marker to the last cacheable block in the request.
          title: Cache Control
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
