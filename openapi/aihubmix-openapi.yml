          anyOf:
          - type: string
          - type: 'null'
          description: Container identifier for reuse across requests.
          title: Container
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
        inference_geo:
          anyOf:
          - type: string
          - type: 'null'
          description: Specifies the geographic region for inference processing. If not specified, the workspace's `default_inference_geo` is
            used.
