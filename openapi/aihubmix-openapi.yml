        maximum: 100
        default: 20
      description: Number of tasks to return.
    AIHubMixOrder:
      name: order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
      description: Task creation order.
  responses:
    AIHubMixError:
      description: AIHubMix task, validation, authentication, routing, artifact, or upstream error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
  securitySchemes:
    gatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'Gateway-issued API key, formatted as `sk-gateway-xxxxxxxx`.

        Used by OpenAI-shaped endpoints (/v1/chat/completions, etc.).

        '
      x-source:
        from: gateway
        authority: gateway
    gatewayAnthropicKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Used by Anthropic-shaped endpoints (/v1/messages). The value is

        the gateway API key, shared with OpenAI-shaped endpoints. Clients

        identifying as anthropic-sdk-* will use this header.

        '
      x-source:
        from: gateway
        authority: gateway
    gatewayGeminiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: 'Used by Gemini-shaped endpoints (/v1beta/...). The value is the

        gateway API key, shared with other endpoint shapes. The google-genai

        SDK uses this header by default.

        '
      x-source:
        from: gateway
        authority: gateway
    gatewayGeminiQuery:
      type: apiKey
      in: query
      name: key
      description: 'Query-parameter fallback for Gemini-shaped endpoints. Some SDKs

        and tools only support the `?key=` form. Value is the same as

        `gatewayGeminiKey`.

        '
      x-source:
        from: gateway
        authority: gateway
security:
- gatewayBearer: []
tags:
- name: OpenAI Compatible
  description: OpenAI-compatible endpoints (chat, completions, embeddings, images, audio, videos, moderations).
- name: Anthropic Compatible
  description: Anthropic-native endpoints (messages with Anthropic protocol).
- name: Google Vertex AI Compatible
  description: Google Gemini / Vertex AI endpoints.
- name: AIHubMix Unified API
  description: AIHubMix native image, video, task, and model-discovery endpoints.
