                - maxOutputTokens
          n:
            type: integer
            minimum: 1
            maximum: 128
            default: 1
            example: 1
            nullable: true
            description: How many chat completion choices to generate for each input message. Note that you will be charged based on the number
              of generated tokens across all of the choices. Keep `n` as `1` to minimize costs.
          prediction:
            nullable: true
