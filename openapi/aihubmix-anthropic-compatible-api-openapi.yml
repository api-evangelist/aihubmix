openapi: 3.2.0
info:
  title: Aihubmix Anthropic Compatible API
  version: 2.1.1
  contact:
    name: AIHubMix Team
  x-upstream:
    vendorSpecs:
      packageVersion: 0.1.1
      installedFrom: npm
    sources:
      openai/official:
        version: '2026-05-31'
        hash: sha256:a203971a0bc0cd3b903b9488e3ac40eaa161a274dfaf172c1da73eee029147a8
      anthropic/official:
        version: '2026-05-31'
        hash: sha256:f9d488f9290d78a081bed62fa0c040476b5d009f3db92c06c8e279e69df73fc9
    layers:
    - role: L0-base
      source: avs://openai/official
      protocol: openai
      authority: official
    - role: L0-base
      source: avs://anthropic/official
      protocol: anthropic
      authority: official
    - role: gateway-other
      source: gateway/anthropic-mappings.yml
      protocol: all
      authority: gateway
    - role: horizontal-auth
      source: gateway/auth.yml
      protocol: all
      authority: gateway
    - role: horizontal-errors
      source: gateway/errors.yml
      protocol: all
      authority: gateway
    - role: L3-gateway
      source: gateway/openai-gateway.yml
      protocol: openai
      authority: gateway
    - role: gateway-other
      source: gateway/openai-image-mappings.yml
      protocol: all
      authority: gateway
    - role: gateway-other
      source: gateway/openai-mappings.yml
      protocol: all
      authority: gateway
    - role: L2-passthrough
      source: gateway/openai-passthrough.yml
      protocol: openai
      authority: gateway
  description: 'Operations tagged Anthropic Compatible across 2 of this provider''s published API definitions: aihubmix-docs-openapi.json, aihubmix-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://aihubmix.com
  description: Production
- url: https://api.inferera.com
  description: Backup (use when the primary domain is unreachable)
security:
- gatewayBearer: []
tags:
- name: Anthropic Compatible
  description: Anthropic-native endpoints (messages with Anthropic protocol).
paths:
  /v1/messages:
    post:
      summary: Create a Message
      description: 'Send a structured list of input messages with text and/or image content, and the model will generate the next message in the conversation.


        The Messages API can be used for either single queries or stateless multi-turn conversations.


        Learn more about the Messages API in our user guide'
      operationId: messages_post
      parameters:
      - name: anthropic-version
        in: header
        required: false
        schema:
          type: string
          description: 'The version of the Claude API you want to use.


            Read more about versioning and our version history [here](https://docs.claude.com/en/api/versioning).'
          title: Anthropic-Version
        description: 'The version of the Claude API you want to use.


          Read more about versioning and our version history [here](https://docs.claude.com/en/api/versioning).'
        x-source:
          from: avs://anthropic/official
          authority: official
      responses:
        '200':
          description: Message object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessage'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AnthropicMessageStreamEvent'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        5XX:
          description: Server / upstream error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicCreateMessageParams'
        required: true
      x-source:
        from: avs://anthropic/official
        authority: official
      security:
      - gatewayAnthropicKey: []
      - gatewayBearer: []
      tags:
      - Anthropic Compatible
    servers:
    - url: https://aihubmix.com
      description: Production
    - url: https://api.inferera.com
      description: Backup (use when the primary domain is unreachable)
components:
  schemas:
    AnthropicRequestMidConvSystemBlock:
      additionalProperties: false
      description: 'System instructions that appear mid-conversation.


        Use this block to provide or update system-level instructions at a specific

        point in the conversation, rather than only via the top-level `system` parameter.'
      properties:
        cache_control:
          anyOf:
          - discriminator:
              mapping:
                ephemeral: '#/components/schemas/CacheControlEphemeral'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/AnthropicCacheControlEphemeral'
          - type: 'null'
          description: Create a cache control breakpoint at this content block.
          title: Cache Control
        content:
          description: System instruction text blocks.
          items:
            discriminator:
              mapping:
                text: '#/components/schemas/RequestTextBlock'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/AnthropicRequestTextBlock'
          title: Content
          type: array
        type:
          const: mid_conv_system
          title: Type
          type: string
      required:
      - content
      - type
      title: RequestMidConvSystemBlock
      type: object
      x-source:
        from: avs://anthropic/official
        authority: official
    AnthropicResponseWebFetchToolResultError:
      properties:
        error_code:
          $ref: '#/components/schemas/AnthropicWebFetchToolResultErrorCode'
        type:
          const: web_fetch_tool_result_error
          default: web_fetch_tool_result_error
          title: Type
          type: string
      required:
      - error_code
      - type
      title: ResponseWebFetchToolResultError
      type: object
      x-source:
        from: avs://anthropic/official
        authority: official
    AnthropicCreateMessageParams:
      additionalProperties: false
      example:
        max_tokens: 1024
        messages:
        - content: Hello, world
          role: user
        model: claude-opus-4-6
      properties:
        model:
          $ref: '#/components/schemas/AnthropicModel'
        messages:
          description: "Input messages.\n\nOur models are trained to operate on alternating `user` and `assistant` conversational turns. When creating a new `Message`, you specify the prior conversational turns with the `messages` parameter, and the model then generates the next `Message` in the conversation. Consecutive `user` or `assistant` turns in your request will be combined into a single turn.\n\nEach input message must be an object with a `role` and `content`. You can specify a single `user`-role message, or you can include multiple `user` and `assistant` messages.\n\nIf the final message uses the `assistant` role, the response content will continue immediately from the content in that message. This can be used to constrain part of the model's response.\n\nExample with a single `user` message:\n\n```json\n[{\"role\": \"user\", \"content\": \"Hello, Claude\"}]\n```\n\nExample with multiple conversational turns:\n\n```json\n[\n  {\"role\": \"user\", \"content\": \"Hello there.\"},\n  {\"role\": \"assistant\", \"content\": \"Hi, I'm Claude. How can I help you?\"},\n  {\"role\": \"user\", \"content\": \"Can you explain LLMs in plain English?\"},\n]\n```\n\nExample with a partially-filled response from Claude:\n\n```json\n[\n  {\"role\": \"user\", \"content\": \"What's the Greek name for Sun? (A) Sol (B) Helios (C) Sun\"},\n  {\"role\": \"assistant\", \"content\": \"The best answer is (\"},\n]\n```\n\nEach input message `content` may be either a single `string` or an array of content blocks, where each block has a specific `type`. Using a `string` for `content` is shorthand for an array of one content block of type `\"text\"`. The following input messages are equivalent:\n\n```json\n{\"role\": \"user\", \"content\": \"Hello, Claude\"}\n```\n\n```json\n{\"role\": \"user\", \"content\": [{\"type\": \"text\", \"text\": \"Hello, Claude\"}]}\n```\n\nSee [input examples](https://docs.claude.com/en/api/messages-examples).\n\nNote that if you want to include a [system prompt](https://docs.claude.com/en/docs/system-prompts), you can use the top-level `system` parameter — there is no `\"system\"` role for input messages in the Messages API.\n\nThere is a limit of 100,000 messages in a single request."
          items:
            $ref: '#/components/schemas/AnthropicInputMessage'
          title: Messages
          type: array
          x-providers:
            openai:
              transform: anthropic_messages_to_openai_messages
            azure:
              transform: anthropic_messages_to_openai_messages
            gemini:
              to:
              - contents
              transform: anthropic_messages_to_gemini_contents
            vertex:
              to:
              - contents
              transform: anthropic_messages_to_gemini_contents
        cache_control:
          anyOf:
          - discriminator:
              mapping:
                ephemeral: '#/components/schemas/CacheControlEphemeral'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/AnthropicCacheControlEphemeral'
          - type: 'null'
          description: Top-level cache control automatically applies a cache_control marker to the last cacheable block in the request.
          title: Cache Control
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
        container:
          anyOf:
          - type: string
          - type: 'null'
          description: Container identifier for reuse across requests.
          title: Container
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
        inference_geo:
          anyOf:
          - type: string
          - type: 'null'
          description: Specifies the geographic region for inference processing. If not specified, the workspace's `default_inference_geo` is used.
          title: Inference Geo
          x-providers-default: drop
          x-providers:
            anthropic: {}
        max_tokens:
          description: 'The maximum number of tokens to generate before stopping.


            Note that our models may stop _before_ reaching this maximum. This parameter only specifies the absolute maximum number of tokens to generate.


            Set to `0` to populate the [prompt cache](https://docs.claude.com/en/docs/build-with-claude/prompt-caching#pre-warming-the-cache) without generating a response.


            Different models have different maximum values for this parameter.  See [models](https://docs.claude.com/en/docs/models-overview) for details.'
          examples:
          - 1024
          minimum: 0
          title: Max Tokens
          type: integer
          x-providers:
            gemini:
              to:
              - generationConfig
              - maxOutputTokens
            vertex:
              to:
              - generationConfig
              - maxOutputTokens
        metadata:
          $ref: '#/components/schemas/AnthropicMetadata'
          description: An object describing metadata about the request.
        output_config:
          $ref: '#/components/schemas/AnthropicOutputConfig'
          description: Configuration options for the model's output, such as the output format.
          x-providers-default: drop
          x-providers:
            anthropic: {}
        service_tier:
          description: 'Determines whether to use priority capacity (if available) or standard capacity for this request.


            Anthropic offers different levels of service for your API requests. See [service-tiers](https://docs.claude.com/en/api/service-tiers) for details.'
          enum:
          - auto
          - standard_only
          title: Service Tier
          type: string
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
        stop_sequences:
          description: 'Custom text sequences that will cause the model to stop generating.


            Our models will normally stop when they have naturally completed their turn, which will result in a response `stop_reason` of `"end_turn"`.


            If you want the model to stop generating when it encounters custom strings of text, you can use the `stop_sequences` parameter. If the model encounters one of the custom sequences, the response `stop_reason` value will be `"stop_sequence"` and the response `stop_sequence` value will contain the matched stop sequence.'
          items:
            type: string
          title: Stop Sequences
          type: array
          x-providers:
            openai:
              to:
              - stop
            azure:
              to:
              - stop
            gemini:
              to:
              - generationConfig
              - stopSequences
            vertex:
              to:
              - generationConfig
              - stopSequences
        stream:
          description: 'Whether to incrementally stream the response using server-sent events.


            See [streaming](https://docs.claude.com/en/api/messages-streaming) for details.'
          title: Stream
          type: boolean
        system:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/AnthropicRequestTextBlock'
            type: array
          description: 'System prompt.


            A system prompt is a way of providing context and instructions to Claude, such as specifying a particular goal or role. See our [guide to system prompts](https://docs.claude.com/en/docs/system-prompts).'
          examples:
          - - text: Today's date is 2024-06-01.
              type: text
          - Today's date is 2023-01-01.
          title: System
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
            openai:
              transform: anthropic_system_to_openai_system_message
            azure:
              transform: anthropic_system_to_openai_system_message
            gemini:
              to:
              - systemInstruction
              transform: anthropic_system_to_gemini_system_instruction
            vertex:
              to:
              - systemInstruction
              transform: anthropic_system_to_gemini_system_instruction
        temperature:
          deprecated: true
          description: 'Amount of randomness injected into the response.


            Defaults to `1.0`. Ranges from `0.0` to `1.0`. Use `temperature` closer to `0.0` for analytical / multiple choice, and closer to `1.0` for creative and generative tasks.


            Note that even with `temperature` of `0.0`, the results will not be fully deterministic.'
          examples:
          - 1
          maximum: 1
          minimum: 0
          title: Temperature
          type: number
          x-providers:
            gemini:
              to:
              - generationConfig
              - temperature
            vertex:
              to:
              - generationConfig
              - temperature
        thinking:
          $ref: '#/components/schemas/AnthropicThinkingConfigParam'
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
        tool_choice:
          $ref: '#/components/schemas/AnthropicToolChoice'
          x-providers:
            openai:
              transform: anthropic_tool_choice_to_openai_tool_choice
            azure:
              transform: anthropic_tool_choice_to_openai_tool_choice
            gemini:
              to:
              - toolConfig
              transform: anthropic_tool_choice_to_gemini_tool_config
            vertex:
              to:
              - toolConfig
              transform: anthropic_tool_choice_to_gemini_tool_config
        tools:
          description: "Definitions of tools that the model may use.\n\nIf you include `tools` in your API request, the model may return `tool_use` content blocks that represent the model's use of those tools. You can then run those tools using the tool input generated by the model and then optionally return results back to the model using `tool_result` content blocks.\n\nThere are two types of tools: **client tools** and **server tools**. The behavior described below applies to client tools. For [server tools](https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview\\#server-tools), see their individual documentation as each has its own behavior (e.g., the [web search tool](https://docs.claude.com/en/docs/agents-and-tools/tool-use/web-search-tool)).\n\nEach tool definition includes:\n\n* `name`: Name of the tool.\n* `description`: Optional, but strongly-recommended description of the tool.\n* `input_schema`: [JSON schema](https://json-schema.org/draft/2020-12) for the tool `input` shape that the model will produce in `tool_use` output content blocks.\n\nFor example, if you defined `tools` as:\n\n```json\n[\n  {\n    \"name\": \"get_stock_price\",\n    \"description\": \"Get the current stock price for a given ticker symbol.\",\n    \"input_schema\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"ticker\": {\n          \"type\": \"string\",\n          \"description\": \"The stock ticker symbol, e.g. AAPL for Apple Inc.\"\n        }\n      },\n      \"required\": [\"ticker\"]\n    }\n  }\n]\n```\n\nAnd then asked the model \"What's the S&P 500 at today?\", the model might produce `tool_use` content blocks in the response like this:\n\n```json\n[\n  {\n    \"type\": \"tool_use\",\n    \"id\": \"toolu_01D7FLrfh4GYq7yT1ULFeyMV\",\n    \"name\": \"get_stock_price\",\n    \"input\": { \"ticker\": \"^GSPC\" }\n  }\n]\n```\n\nYou might then run your `get_stock_price` tool with `{\"ticker\": \"^GSPC\"}` as an input, and return the following back to the model in a subsequent `user` message:\n\n```json\n[\n  {\n    \"type\": \"tool_result\",\n    \"tool_use_id\": \"toolu_01D7FLrfh4GYq7yT1ULFeyMV\",\n    \"content\": \"259.75 USD\"\n  }\n]\n```\n\nTools can be used for workflows that include running client-side tools and functions, or more generally whenever you want the model to produce a particular JSON structure of output.\n\nSee our [guide](https://docs.claude.com/en/docs/tool-use) for more details."
          examples:
          - description: Get the current weather in a given location
            input_schema:
              properties:
                location:
                  description: The city and state, e.g. San Francisco, CA
                  type: string
                unit:
                  description: Unit for the output - one of (celsius, fahrenheit)
                  type: string
              required:
              - location
              type: object
            name: get_weather
          items:
            oneOf:
            - $ref: '#/components/schemas/AnthropicTool'
            - $ref: '#/components/schemas/AnthropicBashTool_20250124'
            - $ref: '#/components/schemas/AnthropicCodeExecutionTool_20250522'
            - $ref: '#/components/schemas/AnthropicCodeExecutionTool_20250825'
            - $ref: '#/components/schemas/AnthropicCodeExecutionTool_20260120'
            - $ref: '#/components/schemas/AnthropicMemoryTool_20250818'
            - $ref: '#/components/schemas/AnthropicTextEditor_20250124'
            - $ref: '#/components/schemas/AnthropicTextEditor_20250429'
            - $ref: '#/components/schemas/AnthropicTextEditor_20250728'
            - $ref: '#/components/schemas/AnthropicWebSearchTool_20250305'
            - $ref: '#/components/schemas/AnthropicWebFetchTool_20250910'
            - $ref: '#/components/schemas/AnthropicWebSearchTool_20260209'
            - $ref: '#/components/schemas/AnthropicWebFetchTool_20260209'
            - $ref: '#/components/schemas/AnthropicWebFetchTool_20260309'
            - $ref: '#/components/schemas/AnthropicToolSearchToolBM25_20251119'
            - $ref: '#/components/schemas/AnthropicToolSearchToolRegex_20251119'
          title: Tools
          type: array
          x-providers:
            openai:
              transform: anthropic_tools_to_openai_tools
            azure:
              transform: anthropic_tools_to_openai_tools
            gemini:
              to:
              - tools
              transform: anthropic_tools_to_gemini_tools
            vertex:
              to:
              - tools
              transform: anthropic_tools_to_gemini_tools
        top_k:
          deprecated: true
          description: 'Only sample from the top K options for each subsequent token.


            Used to remove "long tail" low probability responses. [Learn more technical details here](https://towardsdatascience.com/how-to-sample-from-language-models-682bceb97277).


            Recommended for advanced use cases only.'
          examples:
          - 5
          minimum: 0
          title: Top K
          type: integer
          x-providers-default: drop
          x-providers:
            anthropic: {}
            bedrock: {}
            cohere: {}
            gemini:
              to:
              - generationConfig
              - topK
            vertex:
              to:
              - generationConfig
              - topK
        top_p:
          deprecated: true
          description: 'Use nucleus sampling.


            In nucleus sampling, we compute the cumulative distribution over all the options for each subsequent token in decreasing probability order and cut it off once it reaches a particular probability specified by `top_p`.


            Recommended for advanced use cases only.'
          examples:
          - 0.7
          maximum: 1
          minimum: 0
          title: Top P
          type: number
          x-providers:
            gemini:
              to:
              - generationConfig
              - topP
            vertex:
              to:
              - generationConfig
              - topP
      required:
      - model
      - messages
      - max_tokens
      title: CreateMessageParams
      type: object
      x-source:
        from: avs://anthropic/official
        authority: official
    AnthropicContentBlock:
      discriminator:
        mapping:
          bash_code_execution_tool_result: '#/components/schemas/ResponseBashCodeExecutionToolResultBlock'
          code_execution_tool_result: '#/components/schemas/ResponseCodeExecutionToolResultBlock'
          container_upload: '#/components/schemas/ResponseContainerUploadBlock'
          redacted_thinking: '#/components/schemas/ResponseRedactedThinkingBlock'
          server_tool_use: '#/components/schemas/ResponseServerToolUseBlock'
          text: '#/components/schemas/ResponseTextBlock'
          text_editor_code_execution_tool_result: '#/components/schemas/ResponseTextEditorCodeExecutionToolResultBlock'
          thinking: '#/components/schemas/ResponseThinkingBlock'
          tool_search_tool_result: '#/components/schemas/ResponseToolSearchToolResultBlock'
          tool_use: '#/components/schemas/ResponseToolUseBlock'
          web_fetch_tool_result: '#/components/schemas/ResponseWebFetchToolResultBlock'
          web_search_tool_result: '#/components/schemas/ResponseWebSearchToolResultBlock'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/AnthropicResponseTextBlock'
      - $ref: '#/components/schemas/AnthropicResponseThinkingBlock'
      - $ref: '#/components/schemas/AnthropicResponseRedactedThinkingBlock'
      - $ref: '#/components/schemas/AnthropicResponseToolUseBlock'
      - $ref: '#/components/schemas/AnthropicResponseServerToolUseBlock'
      - $ref: '#/components/schemas/AnthropicResponseWebSearchToolResultBlock'
      - $ref: '#/components/schemas/AnthropicResponseWebFetchToolResultBlock'
      - $ref: '#/components/schemas/AnthropicResponseCodeExecutionToolResultBlock'
      - $ref: '#/components/schemas/AnthropicResponseBashCodeExecutionToolResultBlock'
      - $ref: '#/components/schemas/AnthropicResponseTextEditorCodeExecutionToolResultBlock'
      - $ref: '#/components/schemas/AnthropicResponseToolSearchToolResultBlock'
      - $ref: '#/components/schemas/AnthropicResponseContainerUploadBlock'
      x-source:
        from: avs://anthropic/official
        authority: official
    GatewayError:
      type: object
      description: 'OpenAI-compatible error envelope. Top-level `error` object carrying

        `message` / `type` / `param` / `code`. `request_id` lives in the

        `X-Request-Id` response header, not in the body. The legacy `upstream`

        field is no longer emitted.

        '
      x-source:
        from: gateway
        authority: gateway
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: Human-readable error message.
            type:
              type: string
              nullable: true
              description: 'Error category. OpenAI-compatible values include

                invalid_request_error / authentication_error / permission_error /

                not_found_error / rate_limit_error, etc. The upstream value is

                passed through verbatim; the enum is not fixed.

                '
            param:
              type: string
              nullable: true
              description: Name of the offending field, when applicable.
            code:
              nullable: true
              description: 'Sub-error code. May be a string or integer (the gateway treats

                `code` as an arbitrary type).

                '
    AnthropicRequestRedactedThinkingBlock:
      additionalProperties: false
      properties:
        data:
          title: Data
          type: string
        type:
          const: redacted_thinking
          title: Type
          type: string
      required:
      - data
      - type
      title: RequestRedactedThinkingBlock
      type: object
      x-source:
        from: avs://anthropic/official
        authority: official
    AnthropicResponseRedactedThinkingBlock:
      properties:
        data:
          title: Data
          type: string
        type:
          const: redacted_thinking
          default: redacted_thinking
          title: Type
          type: string
      required:
      - data
      - type
      title: ResponseRedactedThinkingBlock
      type: object
      x-source:
        from: avs://anthropic/official
        authority: official
    AnthropicToolSearchToolRegex_20251119:
      additionalProperties: false
      properties:
        allowed_callers:
          items:
            $ref: '#/components/schemas/AnthropicAllowedCaller'
          title: Allowed Callers
          type: array
        cache_control:
          anyOf:
          - discriminator:
              mapping:
                ephemeral: '#/components/schemas/CacheControlEphemeral'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/AnthropicCacheControlEphemeral'
          - type: 'null'
          description: Create a cache control breakpoint at this content block.
          title: Cache Control
        defer_loading:
          description: If true, tool will not be included in initial system prompt. Only loaded when returned via tool_reference from tool search.
          title: Defer Loading
          type: boolean
        name:
          const: tool_search_tool_regex
          description: 'Name of the tool.


            This is how the tool will be called by the model and in `tool_use` blocks.'
          title: Name
          type: string
        strict:
          description: When true, guarantees schema validation on tool names and inputs
          title: Strict
          type: boolean
        type:
          enum:
          - tool_search_tool_regex_20251119
          - tool_search_tool_regex
          title: Type
          type: string
      required:
      - name
      - type
      title: ToolSearchToolRegex_20251119
      type: object
