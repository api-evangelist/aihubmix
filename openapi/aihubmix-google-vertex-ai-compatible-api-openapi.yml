openapi: 3.2.0
info:
  title: Aihubmix Google Vertex AI Compatible API
  version: 2.1.1
  contact:
    name: AIHubMix Team
  x-upstream:
    vendorSpecs:
      packageVersion: 0.1.1
      installedFrom: npm
    sources:
      openai/official:
        version: '2026-05-31'
        hash: sha256:a203971a0bc0cd3b903b9488e3ac40eaa161a274dfaf172c1da73eee029147a8
      anthropic/official:
        version: '2026-05-31'
        hash: sha256:f9d488f9290d78a081bed62fa0c040476b5d009f3db92c06c8e279e69df73fc9
    layers:
    - role: L0-base
      source: avs://openai/official
      protocol: openai
      authority: official
    - role: L0-base
      source: avs://anthropic/official
      protocol: anthropic
