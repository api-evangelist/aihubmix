aid: aihubmix
name: AIHubMix
image: https://aihubmix.com/og/default.png
description: AIHubMix is an AI model routing gateway that exposes hundreds of large
  language, image, video and audio models from many vendors behind one API key, with
  OpenAI-compatible, Anthropic-compatible and Google Gemini/Vertex-compatible endpoints
  plus its own unified image, video and task APIs, pay-as-you-go billing, a remote
  MCP server, a command-line tool and agent skills.
