name: AIHubMix MCP Server
generated: '2026-10-13'
method: probed
source: https://aihubmix.com/mcp (initialize + tools/list, anonymous, HTTP 200; serverInfo aihubmix-mcp
  0.7.0)
status: live
deployment:
  mode: remote
  endpoint: https://aihubmix.com/mcp
  auth: unknown
  verified: probed
also_served_at:
- https://api.aihubmix.com/mcp
docs_search_server:
  endpoint: https://docs.aihubmix.com/mcp
  note: Documentation-search MCP server on the docs host (tools/list returned search_ai_hub_mix over text/event-stream).
tools:
- name: ping
  description: 'Health-check every configured gateway endpoint (with latency) and report which one is
    active. Diagnostic: returns ok=false with reasons instead of erroring when endpoints are down.'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties: {}
- name: models-list
  description: Search the live AIHubMix model catalog with pricing (USD per 1K tokens), context window,
    modalities and features. All filters are optional and combined with AND. Public data, no API key needed.
  inputSchema:
    type: object
    properties:
      search:
        type: string
        description: Full-text search over model id, name and description, e.g. 'gpt-5', 'claude', 'reasoning'
      type:
        type: string
        enum:
        - llm
        - image_generation
        - video
        - tts
        - stt
        - embedding
        - rerank
        description: Model type
      modalities:
        type: string
        description: 'Required input modalities, comma-separated: text,image,audio,video,pdf'
      features:
        type: string
        description: 'Required features, comma-separated: thinking,tools,function_calling,web,deepsearch,long_context,structured_outputs'
      sort_by:
        type: string
        enum:
        - model_ratio
        - context_length
        - coding
        - order
        description: model_ratio = price, context_length, coding = coding models first, order = default
      sort_order:
        type: string
        enum:
        - asc
        - desc
      limit:
        type: integer
        minimum: 1
        maximum: 100
        description: Max results to return (default 20)
      offset:
        type: integer
        minimum: 0
        description: Skip this many results (default 0)
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: model-get
  description: Fetch full details for a single model by exact model_id (pricing, full description, capabilities).
    Returns close-match suggestions when the id is unknown. Public data, no API key needed.
  inputSchema:
    type: object
    properties:
      model_id:
        type: string
        minLength: 1
        maxLength: 120
        description: Exact model id, e.g. 'gpt-5-nano' or 'claude-sonnet-4-6'
    required:
    - model_id
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: credits-get
  description: 'Account balance for the calling API key: total quota, used and remaining (USD), plus key
    expiry. Requires an API key.'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties: {}
- name: chat-send
  description: Send one non-streaming chat message to any AIHubMix model and get the reply with token
    usage and latency. Intended for quick model testing/comparison from the editor. Requires an API key
    and CONSUMES CREDITS.
  inputSchema:
    type: object
    properties:
      model:
        type: string
        minLength: 1
        maxLength: 120
        description: Model id, e.g. 'gpt-5-nano'
      prompt:
        type: string
        minLength: 1
        maxLength: 8000
        description: Single-turn user message (use this OR messages)
      messages:
        type: array
        items:
          type: object
          properties:
            role:
              type: string
              enum:
              - user
              - assistant
              - system
            content:
              type: string
              maxLength: 16000
          required:
          - role
          - content
          additionalProperties: false
        minItems: 1
        maxItems: 50
        description: Multi-turn conversation (use this OR prompt)
      system:
        type: string
        maxLength: 16000
        description: Optional system prompt (prepended)
      max_tokens:
        type: integer
        minimum: 1
        maximum: 8192
        description: Response token cap (default 1024)
      temperature:
        type: number
        minimum: 0
        maximum: 2
    required:
    - model
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: image-generate
  description: 'Generate image(s) across 23 models / 8 families. Text-to-image and image-to-image (pass
    input_reference). Models: nano-banana-pro/nano-banana-2 (Gemini native: aspect_ratio, size 1K/2K/4K,
    google_search); gpt-image-1.5/gpt-image-1/gpt-image-1-mini/dall-e-3 (OpenAI: size, n, quality, background,
    output_format); imagen-4.0-ultra/imagen-4.0/imagen-4.0-fast/imagen-3.0 (aspect_ratio, n); flux-2-pro/flu'
  inputSchema:
    type: object
    properties:
      model:
        type: string
        enum:
        - nano-banana-pro
        - nano-banana-2
        - gpt-image-1.5
        - gpt-image-1
        - gpt-image-1-mini
        - dall-e-3
        - imagen-4.0-ultra
        - imagen-4.0
        - imagen-4.0-fast
        - imagen-3.0
        - flux-2-pro
        - flux-2-flex
        - ideogram-v3
        - seedream-5.0-lite
        - seedream-4.5
        - seedream-4.0
        - wan2.7-image-pro
        - wan2.7-image
        - wan2.6-image
        - qwen-image-2.0-pro
        - qwen-image-2.0
        - qwen-image-max
        - qwen-image
        - openai/gpt-image-1
        - opanai/gpt-image-1
        - bfl/FLUX.1-Kontext-pro
        - google/imagen-4.0-ultra-generate-preview-06-06
        - google/imagen-4.0-generate-preview-06-06
        - ideogram/V3
        description: Image model (see description for per-model params)
      prompt:
        type: string
        minLength: 1
        maxLength: 32000
        description: What to draw (all models)
      input_reference:
        type: string
        format: uri
        description: Reference image URL for image-to-image (supported models only)
      size:
        type: string
        description: OpenAI 1024x1024/1024x1536/1536x1024/auto; Doubao/Wan 1K/2K/4K or WxH; Qwen WxH
      aspect_ratio:
        type: string
        description: e.g. 1:1, 16:9, 9:16 (Gemini/Imagen/Flux/Ideogram/Wan)
      n:
        type: integer
        minimum: 1
        maximum: 12
        description: Number of images (OpenAI/Imagen/Qwen/Wan)
      quality:
        type: string
        enum:
        - low
        - medium
        - high
        - auto
        description: OpenAI image quality
      moderation:
        type: string
        enum:
        - auto
        - low
        description: OpenAI content moderation
      background:
        type: string
        enum:
        - transparent
        - opaque
        - auto
        description: OpenAI background
      output_format:
        type: string
        enum:
        - png
        - jpeg
        - webp
        description: OpenAI output format
      input_fidelity:
        type: string
        enum:
        - low
        - high
        description: OpenAI edit fidelity to reference
      response_format:
        type: string
        enum:
        - url
        - base64_json
        description: Doubao response format
      rendering_speed:
        type: string
        enum:
        - QUALITY
        - SPEED
        description: Ideogram rendering speed
      negative_prompt:
        type: string
        description: Wan/Qwen negative prompt
      prompt_extend:
        type: boolean
        description: Wan/Qwen automatic prompt rewriting
      thinking_mode:
        type: boolean
        description: Wan 2.7 thinking mode
      google_search:
        type: boolean
        description: Gemini native Google Search grounding
      watermark:
        type: boolean
        description: Doubao/Wan/Qwen watermark
      safety_tolerance:
        type: string
        enum:
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        description: FLUX safety tolerance (0 strictest … 6 loosest)
      seed:
        type: integer
        description: Random seed for reproducibility
    required:
    - model
    - prompt
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: video-generate
  description: 'Generate a video (submits a task then polls until ready — can take several minutes). Models:
    seedance-2.0 / seedance-2.0-fast (ByteDance SeeDance, 4-15s, resolution 480p/720p/1080p, aspect_ratio,
    watermark, seed, camera_fixed, generate_audio, image-to-video); sora-2 / sora-2-pro (OpenAI Sora,
    4/8/12s, size 720x1280…1792x1024, image-to-video); wan-2.7 / wan-2.6 / wan-2.5 (Alibaba Wan, size
    WxH, ima'
  inputSchema:
    type: object
    properties:
      model:
        type: string
        enum:
        - seedance-2.0
        - seedance-2.0-fast
        - wan-2.7
        - wan-2.6
        - wan-2.5
        - sora-2
        - sora-2-pro
        - jimeng-3.0-pro
        - jimeng-3.0
        description: Video model
      prompt:
        type: string
        minLength: 1
        maxLength: 8000
        description: What the video should show
      input_reference:
        type: string
        format: uri
        description: Reference image URL for image-to-video (supported models)
      seconds:
        type: integer
        minimum: 1
        maximum: 20
        description: Duration (snapped to the model's supported range)
      size:
        type: string
        description: Pixel size WxH (Sora/Wan/Jimeng), e.g. 1280x720
      aspect_ratio:
        type: string
        description: e.g. 16:9, 9:16 (SeeDance ratio)
      resolution:
        type: string
        enum:
        - 480p
        - 720p
        - 1080p
        description: Resolution token (SeeDance)
      watermark:
        type: boolean
        description: Add watermark (SeeDance)
      seed:
        type: integer
        description: Random seed (SeeDance)
      camera_fixed:
        type: boolean
        description: Fix the camera (SeeDance)
      generate_audio:
        type: boolean
        description: Generate audio track (SeeDance/Wan)
    required:
    - model
    - prompt
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: docs-search
  description: Search the official AIHubMix documentation index (docs.aihubmix.com) by keyword; returns
    page titles, URLs and summaries. Follow up with docs-get to read a page. Public data, no API key needed.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 300
        description: Keywords, English or Chinese, e.g. 'claude code' or '计费'
      lang:
        type: string
        enum:
        - cn
        - en
        - de
        - es
        description: 'Restrict to one docs language (default: all)'
      limit:
        type: integer
        minimum: 1
        maximum: 25
        description: Max results (default 8)
      search_content:
        type: boolean
        description: true = search full page bodies and return snippets (slower first call); default searches
          titles/summaries
    required:
    - query
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: docs-get
  description: Fetch one documentation page from docs.aihubmix.com as markdown (use URLs returned by docs-search).
    Public data, no API key needed.
  inputSchema:
    type: object
    properties:
      url:
        type: string
        format: uri
        description: Docs page URL from docs-search, e.g. https://docs.aihubmix.com/cn/api/Claude-Code.md
    required:
    - url
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: account-get
  description: 'Account-level profile and balance for the Access Key owner: username, group, total balance
    and used amount (USD), request count. This is the ACCOUNT balance — credits-get shows the calling
    sk- key''s balance. Requires an Access Key (AIHUBMIX_ACCESS_KEY or the X-Aihubmix-Access-Key header).'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties: {}
- name: keys-list
  description: List the account's API keys with status, remaining/used quota (USD), expiry and model/IP
    restrictions. Key values are masked (last 4 chars only). Requires an Access Key (AIHUBMIX_ACCESS_KEY
    or the X-Aihubmix-Access-Key header).
  inputSchema:
    type: object
    properties:
      num:
        type: integer
        minimum: 1
        maximum: 500
        description: Max keys to return (upstream default when omitted)
    additionalProperties: false
    $schema: http://json-schema.org/draft-07/schema#
- name: account-models
  description: Models usable by THIS account's group (may differ from the public catalog in models-list).
    Requires an Access Key (AIHUBMIX_ACCESS_KEY or the X-Aihubmix-Access-Key header).
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties: {}
